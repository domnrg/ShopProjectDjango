{% extends "catalog/base.html" %}
{% block content %}
{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Создание поста{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="container mt-5">
    <h1 class="mb-4">{{ post.title }}</h1>
    <p>{{ post.content }}</p>
    <p>Создано: {{ post.created_at }}</p>
    <p>Количество просмотров: {{ post.counter }}</p>
    <a href="{% url 'blog:post_update' object.pk %}" class="btn btn-secondary mt-3">Редактировать</a>
    <a href="{% url 'blog:post_delete' object.pk %}" class="btn btn-danger mt-3">Удалить</a>
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
{% endblock %}
